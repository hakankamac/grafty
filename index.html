<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grafty — Modern Villa Housing</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800;900&family=Hanken+Grotesk:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --c-bg: #0b0b0c;
    --c-fg: #ffffff;
    --c-ink: #0a0a0a;
    --c-muted: rgba(255, 255, 255, 0.72);
    --c-line: rgba(255, 255, 255, 0.35);
    --c-glass: rgba(255, 255, 255, 0.08);
    --easing: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
    font-weight: 400;
    color: var(--c-fg);
    background: var(--c-bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 640px;
    overflow: hidden;
    isolation: isolate;
  }

  .hero__layers {
    position: absolute;
    inset: 0;
    z-index: -3;
  }

  .hero__bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transform: scale(1.08);
    transition: opacity 1.2s var(--easing);
    will-change: opacity, transform;
  }

  .hero__bg.is-active {
    opacity: 1;
    transform: scale(1.0);
    transition: opacity 1.2s var(--easing), transform 6.5s ease-out;
  }

  /* Gradient overlay — deeper toward center & bottom for legibility */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.2) 45%, transparent 70%),
      linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.15) 35%, rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.78) 100%);
    z-index: -2;
  }

  /* Subtle film grain for depth */
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: 0.07;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------- Header ---------- */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 28px 40px;
    gap: 24px;
    z-index: 5;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: "Archivo", sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.04em;
    color: #fff;
  }

  .logo__mark {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: #fff;
    color: var(--c-ink);
    display: grid;
    place-items: center;
    font-family: "Archivo", sans-serif;
    font-weight: 900;
    font-size: 18px;
    transform: rotate(-6deg);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  }

  .nav {
    justify-self: center;
    background: #fff;
    color: var(--c-ink);
    border-radius: 999px;
    padding: 10px 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    backdrop-filter: blur(8px);
  }

  .nav__list {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .nav__link {
    display: inline-block;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.01em;
    border-radius: 999px;
    transition: background 0.25s var(--easing);
  }

  .nav__link:hover { background: rgba(0,0,0,0.06); }

  .nav__sep {
    width: 1px;
    height: 16px;
    background: rgba(0,0,0,0.18);
  }

  .header__actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-talk {
    background: #fff;
    color: var(--c-ink);
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.3s var(--easing), box-shadow 0.3s var(--easing);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }

  .btn-talk::after {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #18a957;
    box-shadow: 0 0 0 3px rgba(24,169,87,0.22);
  }

  .btn-talk:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }

  .btn-menu {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #fff;
    color: var(--c-ink);
    display: grid;
    place-items: center;
    transition: transform 0.3s var(--easing);
  }

  .btn-menu:hover { transform: rotate(90deg); }

  .btn-menu svg { width: 18px; height: 18px; }

  /* ---------- Headline ---------- */
  .stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 0 24px;
    z-index: 2;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: "Hanken Grotesk", sans-serif;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--c-muted);
    margin-bottom: 26px;
    opacity: 0;
    transform: translateY(40px);
  }
  .stage.is-animating .eyebrow { animation: rise 1s var(--easing) 0.15s forwards; }
  .eyebrow::before {
    content: "";
    width: 28px; height: 1px;
    background: var(--c-line);
  }

  .title {
    font-family: "Archivo", sans-serif;
    font-weight: 900;
    font-size: clamp(3.4rem, 13.2vw, 13rem);
    line-height: 0.86;
    letter-spacing: -0.045em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 4px 60px rgba(0,0,0,0.35);
  }

  .title__line {
    display: block;
    overflow: hidden;
  }

  .title__line span {
    display: inline-block;
    transform: translateY(110%);
    will-change: transform;
  }
  .stage.is-animating .title__line:nth-child(1) span {
    animation: titleRise 1.1s var(--easing) 0.30s forwards;
  }
  .stage.is-animating .title__line:nth-child(2) span {
    animation: titleRise 1.1s var(--easing) 0.45s forwards;
  }
  @keyframes titleRise {
    0%   { transform: translateY(110%); }
    100% { transform: translateY(0); }
  }

  .title__accent {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-weight: 400;
    text-transform: none;
    letter-spacing: -0.02em;
    color: #fff;
    opacity: 0.92;
  }

  .subtitle {
    margin-top: 26px;
    font-size: clamp(15px, 1.15vw, 18px);
    font-weight: 300;
    letter-spacing: 0.005em;
    color: var(--c-muted);
    max-width: 520px;
    line-height: 1.55;
    opacity: 0;
    transform: translateY(40px);
  }
  .stage.is-animating .subtitle { animation: rise 1s var(--easing) 0.75s forwards; }

  @keyframes rise {
    0%   { transform: translateY(40px); opacity: 0; }
    100% { transform: translateY(0);    opacity: 1; }
  }

  /* ---------- Side rail ---------- */
  .rail {
    position: absolute;
    left: 40px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 4;
    color: var(--c-muted);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0;
    animation: rise 1s var(--easing) 1.1s forwards;
  }
  .rail::before {
    content: "";
    width: 1px; height: 56px;
    background: var(--c-line);
    margin-bottom: 6px;
  }
  .rail span { writing-mode: vertical-rl; transform: rotate(180deg); }

  .meta-right {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    opacity: 0;
    animation: rise 1s var(--easing) 1.2s forwards;
  }
  .meta-right .num {
    font-family: "Archivo", sans-serif;
    font-weight: 800;
    font-size: 44px;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .meta-right .label {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--c-muted);
  }

  /* ---------- Footer controls ---------- */
  .footer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 28px 40px 36px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 5;
    opacity: 0;
    animation: rise 1s var(--easing) 1.3s forwards;
  }

  .chips {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .chip {
    padding: 11px 22px;
    border: 1px solid rgba(255,255,255,0.55);
    border-radius: 999px;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    background: transparent;
    transition: background 0.3s var(--easing), border-color 0.3s var(--easing);
    backdrop-filter: blur(6px);
  }
  .chip:hover { background: rgba(255,255,255,0.12); border-color: #fff; }
  .chip--active { background: rgba(255,255,255,0.16); border-color: #fff; }

  .slider {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 14px;
  }

  .slider__count {
    font-family: "Archivo", sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--c-muted);
  }
  .slider__count strong { color: #fff; font-size: 18px; margin-right: 6px; }

  .progress {
    width: 140px;
    height: 1px;
    background: rgba(255,255,255,0.25);
    overflow: hidden;
    position: relative;
  }
  .progress__bar {
    display: block;
    width: 0%;
    height: 100%;
    background: #fff;
  }
  .progress.is-running .progress__bar {
    animation: progressFill 5s linear forwards;
  }
  @keyframes progressFill {
    from { width: 0%; }
    to   { width: 100%; }
  }

  .slider__nav { display: flex; gap: 10px; }

  .nav-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    transition: transform 0.3s var(--easing), background 0.3s var(--easing);
  }
  .nav-btn svg { width: 18px; height: 18px; }
  .nav-btn--prev { background: #fff; color: var(--c-ink); }
  .nav-btn--prev:hover { transform: translateX(-3px); }
  .nav-btn--next {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.7);
    color: #fff;
    backdrop-filter: blur(6px);
  }
  .nav-btn--next:hover { transform: translateX(3px); background: rgba(255,255,255,0.12); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1024px) {
    .header { padding: 22px 24px; gap: 12px; }
    .nav { padding: 8px 6px; }
    .nav__link { padding: 7px 12px; font-size: 13px; }
    .footer { padding: 22px 24px 28px; }
    .rail, .meta-right { display: none; }
  }

  @media (max-width: 768px) {
    .header {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "logo actions"
        "nav nav";
    }
    .logo { grid-area: logo; font-size: 24px; }
    .header__actions { grid-area: actions; }
    .nav {
      grid-area: nav;
      justify-self: stretch;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav__list { justify-content: center; }
    .btn-talk { padding: 10px 16px; font-size: 13px; }
    .btn-talk::after { display: none; }

    .title { letter-spacing: -0.035em; }
    .stage { padding: 0 18px; padding-top: 80px; }

    .footer {
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
    }
    .chips { justify-content: center; }
    .slider {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }
  }

  @media (max-width: 480px) {
    .nav__sep { display: none; }
    .nav__link { padding: 7px 10px; }
    .header__actions .btn-talk { display: none; }
  }
</style>
</head>

<body>
  <section class="hero" aria-label="Modern villa housing hero">
    <div class="hero__layers" aria-hidden="true">
      <div class="hero__bg" data-bg style="background-image:url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2400&q=80')"></div>
      <div class="hero__bg" data-bg style="background-image:url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=2400&q=80')"></div>
      <div class="hero__bg" data-bg style="background-image:url('https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=2400&q=80')"></div>
      <div class="hero__bg" data-bg style="background-image:url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2400&q=80')"></div>
    </div>

    <!-- Header -->
    <header class="header">
      <a class="logo" href="#" aria-label="Grafty home">
        <span class="logo__mark">G</span>
        <span>grafty</span>
      </a>

      <nav class="nav" aria-label="Primary">
        <ul class="nav__list">
          <li><a class="nav__link" href="#">Home</a></li>
          <li class="nav__sep" aria-hidden="true"></li>
          <li><a class="nav__link" href="#">About</a></li>
          <li class="nav__sep" aria-hidden="true"></li>
          <li><a class="nav__link" href="#">Project</a></li>
          <li class="nav__sep" aria-hidden="true"></li>
          <li><a class="nav__link" href="#">Blog</a></li>
        </ul>
      </nav>

      <div class="header__actions">
        <button class="btn-talk" type="button">İLETİŞİM</button>
        <button class="btn-menu" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 9h16M4 15h16" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Side rail -->
    <aside class="rail" aria-hidden="true">
      <span>Est. 2014 — Studio</span>
    </aside>

    <!-- Right meta -->
    <aside class="meta-right" aria-hidden="true">
      <span class="num">04</span>
      <span class="label">Featured Estates</span>
    </aside>

    <!-- Headline -->
    <div class="stage">
      <div>
        <p class="eyebrow">Architecture · Interiors · Landscape</p>

        <h1 class="title">
          <span class="title__line"><span>Modern <em class="title__accent">Villa</em></span></span>
          <span class="title__line"><span>Housing</span></span>
        </h1>

        <p class="subtitle">
          Serene jungle bungalow villa with rustic charming and modern comforts.
        </p>
      </div>
    </div>

    <!-- Footer controls -->
    <footer class="footer">
      <div class="chips">
        <button class="chip chip--active" type="button">Architecture</button>
        <button class="chip" type="button">Interior</button>
      </div>

      <div class="slider">
        <span class="slider__count"><strong data-current>01</strong> / <span data-total>04</span></span>
        <div class="progress" aria-hidden="true"><span class="progress__bar"></span></div>
        <div class="slider__nav">
          <button class="nav-btn nav-btn--prev" type="button" aria-label="Previous slide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <button class="nav-btn nav-btn--next" type="button" aria-label="Next slide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </section>

  <script>
    (function () {
      const SLIDE_MS = 5000;
      const slides = document.querySelectorAll('.hero__bg');
      const stage = document.querySelector('.stage');
      const progress = document.querySelector('.progress');
      const counter = document.querySelector('[data-current]');
      const totalEl = document.querySelector('[data-total]');
      const prevBtn = document.querySelector('.nav-btn--prev');
      const nextBtn = document.querySelector('.nav-btn--next');

      const total = slides.length;
      let index = -1;
      let timerId = null;

      const pad = (n) => String(n).padStart(2, '0');
      totalEl.textContent = pad(total);

      function reflow(el) { void el.offsetWidth; }

      function activate(next) {
        if (index >= 0) slides[index].classList.remove('is-active');
        index = (next + total) % total;
        slides[index].classList.add('is-active');

        counter.textContent = pad(index + 1);

        // Re-trigger title rise
        stage.classList.remove('is-animating');
        reflow(stage);
        stage.classList.add('is-animating');

        // Reset progress bar
        progress.classList.remove('is-running');
        reflow(progress);
        progress.classList.add('is-running');
      }

      function start() {
        clearInterval(timerId);
        timerId = setInterval(() => activate(index + 1), SLIDE_MS);
      }

      function jump(delta) {
        activate(index + delta);
        start();
      }

      prevBtn.addEventListener('click', () => jump(-1));
      nextBtn.addEventListener('click', () => jump(1));

      // Initial mount: kick off first slide so crossfade fires on first paint too
      requestAnimationFrame(() => {
        activate(0);
        start();
      });
    })();
  </script>
</body>
</html>
